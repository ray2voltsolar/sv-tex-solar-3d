<!doctype html>

<!--
  Browser test for js/analysis/shading.js (three-mesh-bvh).
    dev/shading-test.html            synthetic scene with analytically known answers (+ BVH speed test)
    dev/shading-test.html?real=1     additionally builds js/buildings + js/solar and runs a real 21 Dec analysis
  Sets window.__ready = true when finished and window.__result = { passed, failed, tests:[...], perf, real }.
  Run:  python tools/shot.py --url ".../dev/shading-test.html" --eval "return window.__result" --out webapp/_screens/analysis_shading_test.png
-->
<style>
  html, body { margin: 0; background: #0f141a; color: #d9e2ec; font: 13px/1.45 ui-monospace, Consolas, monospace; }
  main { padding: 14px 18px; max-width: 1240px; }
  h1 { font: 600 16px system-ui, sans-serif; margin: 0 0 4px; color: #fff; }
  .sub { color: #8aa0b4; margin-bottom: 10px; font: 12px system-ui, sans-serif; }
  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  th:nth-child(1), td:nth-child(1) { width: 46px; } th:nth-child(2), td:nth-child(2) { width: 46%; }
  td { overflow-wrap: anywhere; }

  #summary { font: 600 15px system-ui, sans-serif; margin: 8px 0; }

</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
    "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.8.3/build/index.module.js"
} }
</script>
</head>
<body>
<main>
  <h1>Shading analyzer — browser test (three-mesh-bvh)</h1>
  <div class="sub">Synthetic scene with closed-form answers · cross-check against the analytic core · BVH speed · optional real-site run (?real=1)</div>
  <div id="summary">running…</div>
  <table id="tbl"><thead><tr><th></th><th>test</th><th>detail</th></tr></thead><tbody></tbody></table>
  <pre id="perf"></pre>
</main>
<script type="module">
import * as THREE from 'three';
import * as site from '../js/site-data.js';
import { createShadingAnalyzer } from '../js/analysis/shading.js';
import { prepareModules, buildDaySamples, runJob } from '../js/analysis/shading-core.js';
import { getSunPosition, dateFromLocal, sunVectorWorld, clearSkyIrradiance } from '../js/analysis/sun.js';

window.__errors = [];
window.addEventListener('error', (e) => window.__errors.push(String(e.message || e)));
window.addEventListener('unhandledrejection', (e) => window.__errors.push(String(e.reason && (e.reason.stack || e.reason))));

const q = new URLSearchParams(location.search);
const RAD = Math.PI / 180;
const tests = [];
const tbody = document.querySelector('#tbl tbody');
function check(name, ok, detail = '') {
  tests.push({ name, pass: !!ok, detail: String(detail) });
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="${ok ? 'ok' : 'bad'}">${ok ? 'PASS' : 'FAIL'}</td><td>${name}</td><td>${detail}</td>`;
  tbody.appendChild(tr);
}
const near = (name, a, b, tol) => check(name, Math.abs(a - b) <= tol, `got ${(+a).toPrecision(8)}, expected ${(+b).toPrecision(8)} ± ${tol}`);

// ---------------------------------------------------------------------------
// synthetic modules (plan coordinates, same conventions as site-data.computeLayout)
// ---------------------------------------------------------------------------
const W = site.MODULE.width, L = site.MODULE.length;
function mkModule(id, x0, y0, z0, tiltDeg, plane = 'T-1') {
  const t = tiltDeg * RAD, u = [1, 0, 0], v = [0, Math.cos(t), Math.sin(t)];       // eave along x, slope rising to the north → faces south
  const n = [0, -Math.sin(t), Math.cos(t)];
  const P = (a, b) => [x0 + u[0] * a + v[0] * b, y0 + u[1] * a + v[1] * b, z0 + u[2] * a + v[2] * b];
  return { id, plane, building: 'T', corners: [P(0, 0), P(W, 0), P(W, L), P(0, L)], n };
}
const toW = (p) => [p[0], p[2], -p[1]];

/** independent per-sample points of a module in WORLD coords (re-derived here, not taken from shading-core) */
function samplePoints(m, nu = 4, nv = 8, off = 0.02) {
  const c0 = toW(m.corners[0]), c1 = toW(m.corners[1]), c3 = toW(m.corners[3]), n = toW(m.n), pts = [];
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const s = (i + 0.5) / nu, t = (j + 0.5) / nv;
    pts.push([0, 1, 2].map((k) => c0[k] + (c1[k] - c0[k]) * s + (c3[k] - c0[k]) * t + n[k] * off));
  }
  return pts;
}
/** independent slab ray/AABB test */
function slab(o, d, min, max) {
  let t0 = 1e-9, t1 = Infinity;
  for (let a = 0; a < 3; a++) {
    if (Math.abs(d[a]) < 1e-14) { if (o[a] < min[a] || o[a] > max[a]) return false; continue; }
    let ta = (min[a] - o[a]) / d[a], tb = (max[a] - o[a]) / d[a]; if (ta > tb) [ta, tb] = [tb, ta];
    t0 = Math.max(t0, ta); t1 = Math.min(t1, tb); if (t0 > t1) return false;
  }
  return true;
}
const expectedFractions = (mods, boxes, dir) => mods.map((m) => {
  const n = toW(m.n); if (n[0] * dir[0] + n[1] * dir[1] + n[2] * dir[2] <= 0) return 1;
  let c = 0; for (const p of samplePoints(m)) if (boxes.some((b) => slab(p, dir, b.min, b.max))) c++; return c / 32;
});

const box = (sx, sy, sz, x, y, z, parent) => {
  const m = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), new THREE.MeshStandardMaterial());
  m.position.set(x, y, z); if (parent) parent.add(m); return m;
};
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

// ---------------------------------------------------------------------------
async function main() {
  const t00 = performance.now();
  const ctx = { THREE, site, sunState: { date: dateFromLocal(2026, 12, 21, 10, 30) } };

  // ===== T1: flat module behind a long west wall — closed form ======================================================
  {
    const mods = [mkModule('F', 0, 0, 0, 0)];
    const wall = box(0.2, 6, 60, -1.1, 3, -1.2);                  // X∈[-1.2,-1.0], Y∈[0,6], Z∈[-31.2, 28.8]   (an "infinite" N–S wall, 1.0 m west of the module)
    const an = createShadingAnalyzer(ctx, { modules: mods, occluders: [wall] });
    const xw = -1.0, H = 6;                                       // east face of the wall (the first plane a ray towards the west meets)
    let allExact = true, worst = 0;
    for (const [az, el] of [[270, 80], [270, 70], [270, 80.5], [270, 85], [250, 80], [90, 30], [180, 50], [300, 75]]) {
      const got = (await an.shadeAt({ azimuth: az, elevation: el }))[0];
      const dir = sunVectorWorld(az, el);
      let cnt = 0;
      for (let i = 0; i < 4; i++) {
        const x = (i + 0.5) / 4 * W;
        if (dir[0] < 0) { const t = (xw - x) / dir[0], h = 0.02 + t * dir[1]; if (h >= 0 && h <= H) cnt++; }
      }
      // module faces up → backfacing never happens for el > 0
      if (Math.abs(got - cnt / 4) > 1e-12) allExact = false; worst = Math.max(worst, Math.abs(got - cnt / 4));
    }
    check('T1 flat module / west wall: BVH shaded fraction = closed form for 8 sun positions', allExact, `max |Δ| = ${worst}`);
    // a wall 1.2 m high: shadow length (H-0.02)/tan(el)
    const low = box(0.2, 1.2, 60, -1.1, 0.6, -1.2);
    const an2 = createShadingAnalyzer(ctx, { modules: mods, occluders: [low] });
    let ok = true, det = [];
    for (const el of [20, 25, 30, 40, 50, 60]) {
      const g = (await an2.shadeAt({ azimuth: 270, elevation: el }))[0];
      const edge = xw + (1.2 - 0.02) / Math.tan(el * RAD);        // shadow edge on the module plane (x from module's west side)
      let cnt = 0; for (let i = 0; i < 4; i++) if ((i + 0.5) / 4 * W <= edge) cnt++;
      const area = Math.min(1, Math.max(0, edge / W));
      if (Math.abs(g - cnt / 4) > 1e-12) ok = false;
      if (Math.abs(g - area) > 0.125 + 1e-9) ok = false;
      det.push(`el${el}: ${g.toFixed(2)} (area ${area.toFixed(2)})`);
    }
    check('T1b 1.2 m wall: shaded fraction = analytic shadow edge (sample grid), within 1/(2·nu) of area fraction', ok, det.join('  '));
  }

  // ===== T2: tilted modules + complex occluder set (group/transform, instancing, invisible, flagged) ================
  {
    const mods = [mkModule('T1', 0, 0, 0, 20), mkModule('T2', 3, 0, 0, 20), mkModule('T3', 0, 5, 1, 20)];
    // visible blockers (AABBs maintained by hand)
    const boxes = [];
    const b1 = box(2, 3, 2, 8, 1.5, -1);                       boxes.push({ min: [7, 0, -2], max: [9, 3, 0] });
    // group with translation + uniform scale 2, child offset
    const g = new THREE.Group(); g.position.set(-6, 0, -9); g.scale.setScalar(2);
    const b2 = box(1, 2, 1, 0, 1, 0, g);                          // child: AABB local [-.5..0.5] x [0..2] x [-.5..0.5] → world x -7..-5, y 0..4, z -10..-8
    boxes.push({ min: [-7, 0, -10], max: [-5, 4, -8] });
    // box rotated 90° about Y: dims (4 x 3 x 1) → world extents (1 x 3 x 4)
    const b3 = box(4, 3, 1, 2.5, 1.5, -12); b3.rotation.y = Math.PI / 2; boxes.push({ min: [2, 0, -14], max: [3, 3, -10] });
    // instanced boxes (2 instances)
    const inst = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 4, 1), new THREE.MeshStandardMaterial(), 3);
    const mt = new THREE.Matrix4();
    mt.makeTranslation(-3, 2, 3); inst.setMatrixAt(0, mt); boxes.push({ min: [-3.5, 0, 2.5], max: [-2.5, 4, 3.5] });
    mt.makeTranslation(1.5, 2, 3); inst.setMatrixAt(1, mt); boxes.push({ min: [1, 0, 2.5], max: [2, 4, 3.5] });
    mt.makeTranslation(100, 2, 100); inst.setMatrixAt(2, mt);
    inst.count = 2;                                              // third instance excluded via .count  → must NOT be expanded
    // ignored: invisible mesh, mesh in invisible group, flagged mesh, hidden-material mesh
    const hid = box(30, 30, 30, 0, 0, 0); hid.visible = false;
    const hg = new THREE.Group(); hg.visible = false; box(30, 30, 30, 0, 0, 0, hg);
    const flagged = box(30, 30, 30, 0, 0, 0); flagged.userData.noOcclusion = true;
    const hm = box(30, 30, 30, 0, 0, 0); hm.material.visible = false;
    const root = new THREE.Group(); root.add(b1, g, b3, inst, hid, hg, flagged, hm);
    // legacy mode: `respectVisibility` makes the scan honour .visible (the DEFAULT now ignores it — see T6)
    const an = createShadingAnalyzer(ctx, { modules: mods, occluders: [root], respectVisibility: true });
    let bad = 0, partial = 0, total = 0, maxd = 0;
    for (let az = 30; az <= 330; az += 15) for (let el = 8; el <= 80; el += 6) {
      const got = await an.shadeAt({ azimuth: az, elevation: el });
      const exp = expectedFractions(mods, boxes, sunVectorWorld(az, el));
      for (let i = 0; i < mods.length; i++) { total++; const d = Math.abs(got[i] - exp[i]); maxd = Math.max(maxd, d); if (d > 1e-12) bad++; if (exp[i] > 0 && exp[i] < 1) partial++; }
    }
    check('T2 group transform + rotation + instancing + ignored (invisible/flagged/hidden-material) meshes: BVH = independent slab test on 3 modules × 475 suns', bad === 0, `${bad} mismatches of ${total}, max |Δ| ${maxd}, partially-shaded cases ${partial}`);
    check('T2 non-trivial (many partially shaded cases)', partial > 60, partial);
    const info = an.getInfo();
    check('T2 triangle count = 3 boxes×12 + 2 instances×12 = 60 (invisible/flagged/.count-excluded not expanded)', info.triangles === 60, `${info.triangles} triangles, ${info.meshes} meshes`);

    // visibility toggling re-builds the index: make a hidden blocker visible and the result changes
    hid.visible = true; an.invalidate();
    const after = await an.shadeAt({ azimuth: 150, elevation: 45 });
    check('T2 invisible mesh made visible → now occludes (BVH rebuilt via signature)', after.every((v) => v === 1), Array.from(after).join(','));
    hid.visible = false;
    const back = await an.shadeAt({ azimuth: 150, elevation: 45 });
    check('T2 hidden again → ignored again', back.some((v) => v < 1), Array.from(back).join(','));
  }

  // ===== T3: whole-day BVH result == analytic-core result with an equivalent analytic occluder =====================
  {
    const mods = [mkModule('F', 0, 0, 0, 0), mkModule('T', 3, 0, 0, 12), mkModule('S', 6, 0, 0, 25)];
    const wall = box(0.2, 1.5, 60, -1.1, 0.75, -1.2);        // X∈[-1.2,-1.0], Y∈[0,1.5]
    const eastBlock = box(1, 4, 8, 14, 2, -5);               // X∈[13.5,14.5] Y∈[0,4] Z∈[-9,-1]
    const boxes = [{ min: [-1.2, 0, -31.2], max: [-1.0, 1.5, 28.8] }, { min: [13.5, 0, -9], max: [14.5, 4, -1] }];
    const an = createShadingAnalyzer(ctx, { modules: mods, occluders: [wall, eastBlock] });
    const res = await an.runDay({ year: 2026, month: 12, day: 21 });
    // reference: pure core with analytic slab occluder
    const prep = prepareModules(mods);
    const ref = await runJob(prep, [buildDaySamples({ year: 2026, month: 12, day: 21 })],
      (ox, oy, oz, dx, dy, dz) => boxes.some((b) => slab([ox, oy, oz], [dx, dy, dz], b.min, b.max)), { kind: 'day', sliceMs: 1e9 });
    let md = 0; for (let i = 0; i < 3; i++) md = Math.max(md, Math.abs(res.perModule[i] - ref.perModule[i]));
    near('T3 runDay (BVH) perModule = analytic-occluder core result', md, 0, 1e-6);
    near('T3 runDay arrayLossPct = analytic', res.arrayLossPct, ref.arrayLossPct, 1e-6);
    near('T3 runDay hourly lossPct (sum) = analytic', res.hourly.reduce((a, h) => a + h.lossPct, 0), ref.hourly.reduce((a, h) => a + h.lossPct, 0), 1e-6);
    check('T3 result shape (SPEC §4.6)', res.perModule instanceof Float32Array && res.perModule.length === 3 && typeof res.arrayLossPct === 'number' && res.perPlaneLossPct['T-1'] >= 0 && Array.isArray(res.worst) && Array.isArray(res.hourly) && res.timing && res.timing.rays > 0, JSON.stringify({ keys: Object.keys(res) }));
    check('T3 shading is non-trivial (some loss, not all)', res.arrayLossPct > 1 && res.arrayLossPct < 60 && res.perModule.some((v) => v > 0), `array loss ${res.arrayLossPct.toFixed(2)} %, perModule ${Array.from(res.perModule).map((v) => v.toFixed(3)).join(' ')}`);
    check('T3 worst[] sorted & indexed', res.worst.length > 0 && res.worst[0].pct >= res.worst[res.worst.length - 1].pct && mods[res.worst[0].index].id === res.worst[0].id, JSON.stringify(res.worst[0]));
    window.__t3 = { arrayLossPct: res.arrayLossPct, perModule: Array.from(res.perModule), timing: res.timing };
    // progress callback contract
    const prog = []; await an.runDay({ year: 2026, month: 6, day: 21 }, { sliceMs: 0 }, (p, info) => prog.push([p, info.phase]));
    check('T3 progress: monotonic 0..1, ends with phase done at exactly 1, starts in prepare', prog.length > 10 && prog.every((v, i) => i === 0 || v[0] >= prog[i - 1][0]) && prog[prog.length - 1][0] === 1 && prog[prog.length - 1][1] === 'done' && prog[0][1] === 'prepare', `${prog.length} callbacks`);
    // second run uses the cached BVH
    const r2 = await an.runDay({ year: 2026, month: 12, day: 21 });
    check('T3 second run reuses the BVH (bvhCached, bvhMs=0)', r2.timing.bvhCached === true && r2.timing.bvhMs === 0, JSON.stringify(r2.timing));
    // Date argument accepted
    const r3 = await an.runDay(dateFromLocal(2026, 12, 21, 9, 0));
    near('T3 runDay(Date) = runDay({y,m,d})', r3.arrayLossPct, res.arrayLossPct, 1e-9);
  }

  // ===== T6: layer-independence, categories, leaf-alpha, tree attribution ===========================================
  {
    const mkTree = (name = 'leaf-card') => {
      // a horizontal leaf card 2 m above the module whose LEFT half is opaque and RIGHT half transparent (alpha-tested like the foliage)
      const cv = document.createElement('canvas'); cv.width = 64; cv.height = 8;
      const g = cv.getContext('2d'); g.fillStyle = 'rgba(0,128,0,1)'; g.fillRect(0, 0, 32, 8);        // u < 0.5 opaque
      const tex = new THREE.CanvasTexture(cv); tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.MeshStandardMaterial({ map: tex, alphaTest: 0.5, side: THREE.DoubleSide });
      const card = new THREE.Mesh(new THREE.PlaneGeometry(W + 1, L + 1), mat);
      card.rotation.x = -Math.PI / 2; card.position.set(W / 2, 2, -L / 2); card.name = name; card.userData.occluderCount = 1;   // covers the module + 0.5 m all round
      const grp = new THREE.Group(); grp.name = 'env-vegetation'; grp.add(card);
      return { grp, card };
    };
    const mods = [mkModule('F', 0, 0, 0, 0)];
    const { grp, card } = mkTree();
    const wallGrp = new THREE.Group(); wallGrp.name = 'building-X';
    const wall = box(0.2, 6, 60, -1.1, 3, -1.2, wallGrp); wall.name = 'X-masonry';
    const root = new THREE.Group(); root.add(grp, wallGrp);
    const mk = (extra = {}) => createShadingAnalyzer(ctx, { modules: mods, occluders: [root], ...extra });
    const up = { azimuth: 180, elevation: 90 };

    // (a) leaf alpha: overhead sun, columns at u = .30 .44 .57 .70 → exactly the two left columns are shaded
    const aw = (await mk().shadeAt(up))[0], an0 = (await mk({ alphaAware: false }).shadeAt(up))[0];
    near('T6 alpha-aware canopy: leaf card with a hole shades exactly the opaque half of the sample grid', aw, 0.5, 1e-12);
    near('T6 alphaAware:false → the same card is a solid slab (legacy)', an0, 1, 1e-12);

    // (b) layer independence
    const vis = (await mk().shadeAt({ azimuth: 270, elevation: 60 }))[0];
    grp.visible = false;
    const hid = (await mk().shadeAt(up))[0], hid2 = (await mk().shadeAt({ azimuth: 270, elevation: 60 }))[0];
    near('T6 hiding the Vegetation layer does NOT change the result (overhead sun, tree shade)', hid, 0.5, 1e-12);
    near('T6 …nor the low-sun wall shading', hid2, vis, 1e-12);
    const legacy = (await mk({ respectVisibility: true }).shadeAt(up))[0];
    near('T6 respectVisibility:true (legacy) → hidden trees drop out', legacy, 0, 1e-12);
    grp.visible = true;

    // (c) explicit include flag
    const noVeg = await mk({ includeVegetation: false }).shadeAt(up);
    near('T6 includeVegetation:false removes the trees by option', noVeg[0], 0, 1e-12);

    // (d) categories / disclosure / attribution over a whole day
    const an = mk();
    const day = await an.runDay({ year: 2026, month: 12, day: 21 });
    const dayNoVeg = await mk({ includeVegetation: false }).runDay({ year: 2026, month: 12, day: 21 });
    const oc = day.occluders;
    check('T6 categories: buildings + vegetation detected, 0 vehicles', oc.categories.vegetation && oc.categories.buildings && oc.vehicles === 0, JSON.stringify(oc.categories));
    check('T6 disclosure text names what was counted and that layers do not matter', /layer/i.test(day.disclosure.text) && day.disclosure.layerIndependent === true, day.disclosure.text);
    check('T6 vegetation attribution present with sensible shares', day.vegetation && day.vegetation.sharePct >= 0 && day.vegetation.sharePct <= 100 && day.vegetation.perModule instanceof Float32Array, JSON.stringify(day.vegetation && { ...day.vegetation, perModule: '…' }));
    near('T6 "loss without trees" (ray-level attribution) = a run with includeVegetation:false', day.vegetation.lossWithoutPct, dayNoVeg.arrayLossPct, 1e-9);
    near('T6 with-trees loss = without + tree-only share', day.arrayLossPct, day.vegetation.lossWithoutPct + day.vegetation.lossPct, 1e-9);
    check('T6 trees add loss (card shades the module)', day.arrayLossPct > dayNoVeg.arrayLossPct + 0.5, `${day.arrayLossPct.toFixed(2)} vs ${dayNoVeg.arrayLossPct.toFixed(2)}`);
    check('T6 includeVegetation:false → res.vegetation null and disclosure says what was left out', dayNoVeg.vegetation === null && /left out/i.test(dayNoVeg.disclosure.text), dayNoVeg.disclosure.text);
    const pre = an.describeOccluders();
    check('T6 describeOccluders() previews the same counts without a BVH', pre.triangles === oc.triangles && pre.disclosure.text.length > 20, JSON.stringify({ t: pre.triangles, o: oc.triangles }));
    window.__t6 = { day: { arrayLossPct: day.arrayLossPct, veg: day.vegetation && { ...day.vegetation, perModule: undefined }, disclosure: day.disclosure.text }, noVeg: dayNoVeg.arrayLossPct };
  }

  // ===== T4: cancel ==================================================================================================
  {
    const mods = site.computeLayout().slice(0, 120);
    const wall = box(0.2, 8, 60, -3, 4, -20);
    const an = createShadingAnalyzer(ctx, { modules: mods, occluders: [wall] });
    const p = an.runYear({ year: 2026 }, () => {});
    await wait(150); an.cancel();
    const r = await p;
    check('T4 cancel() → runYear promise resolves to null', r === null, String(r));
    check('T4 analyzer reusable after cancel', (await an.runDay({ year: 2026, month: 12, day: 21 })) !== null);
    // a new run supersedes a running one
    const p1 = an.runYear({ year: 2026 }); await wait(100); const p2 = an.runDay({ year: 2026, month: 3, day: 20 });
    const [a1, a2] = await Promise.all([p1, p2]);
    check('T4 starting a new run cancels the previous one', a1 === null && a2 && a2.kind === 'day');
  }

  // ===== T5: speed with a heavy occluder soup ========================================================================
  const perf = {};
  {
    const mods = site.computeLayout();
    // 25,000 boxes (300k triangles) scattered like a dense neighbourhood around the site, none on the module plane
    const geo = new THREE.BoxGeometry(1, 1, 1), mat = new THREE.MeshStandardMaterial();
    const nInst = 25000, inst = new THREE.InstancedMesh(geo, mat, nInst);
    const m4 = new THREE.Matrix4(), rnd = (() => { let s = 12345; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; })();
    for (let i = 0; i < nInst; i++) {
      const x = -60 + rnd() * 160, z = -130 + rnd() * 190, h = 1 + rnd() * 9;
      m4.compose(new THREE.Vector3(x, h / 2 - 0.3, z), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, rnd() * 3, 0)), new THREE.Vector3(1 + rnd() * 5, h, 1 + rnd() * 5));
      inst.setMatrixAt(i, m4);
    }
    const an = createShadingAnalyzer(ctx, { modules: mods, occluders: [inst] });
    const t0 = performance.now();
    const day = await an.runDay({ year: 2026, month: 12, day: 21 });
    perf.heavy = { triangles: day.timing.triangles, bvhMs: Math.round(day.timing.bvhMs), traceMs: Math.round(day.timing.traceMs), totalMs: Math.round(performance.now() - t0), rays: day.timing.rays, raysPerSec: Math.round(day.timing.raysPerSec), arrayLossPct: +day.arrayLossPct.toFixed(2), yields: day.timing.yields };
    check('T5 BVH over 300k triangles + 21 Dec day (234 modules) completes', day && day.timing.triangles === 300000, JSON.stringify(perf.heavy));
    // yield behaviour: the main thread must stay responsive. count rAF-independent timers during a run
    let ticks = 0, maxGap = 0, last = performance.now(); const gaps = []; const iv = setInterval(() => { const n = performance.now(); const g = n - last; maxGap = Math.max(maxGap, g); gaps.push(g); last = n; ticks++; }, 5);
    const day2 = await an.runDay({ year: 2026, month: 3, day: 20 }, { stepMin: 30 });
    clearInterval(iv);
    gaps.sort((a, b) => a - b);
    const p95 = gaps.length ? gaps[Math.floor(gaps.length * 0.95)] : Infinity, over120 = gaps.filter((g) => g > 120).length;
    perf.responsiveness = { runMs: Math.round(day2.timing.totalMs), timerTicksDuringRun: ticks, medianGapMs: Math.round(gaps[gaps.length >> 1] || 0), p95GapMs: Math.round(p95), maxTimerGapMs: Math.round(maxGap), gapsOver120ms: over120 };
    // Pass/fail uses load-independent criteria only: a run that never yielded would give ~0 timer ticks and at most ~1 yield per step.
    // The wall-clock gap statistics are reported for information; on a CPU saturated by other headless browsers the OS descheduling
    // dominates them (measured earlier on a quieter machine: max timer gap 30 ms).
    perf.responsiveness.yields = day2.timing.yields; perf.responsiveness.steps = day2.timing.steps;
    check("T5 time-slicing keeps the event loop alive (timer fires > 20x during the run; driver yields > 3x per step; gap stats informational)",
      ticks > 20 && day2.timing.yields > 3 * day2.timing.steps, JSON.stringify(perf.responsiveness));
    // projection: year run is 12 days × 30-min steps ≈ 12×25 steps
    perf.yearEstimateMs = Math.round(day.timing.traceMs * (12 * 24) / day.timing.steps);
  }

  window.__result = { passed: tests.filter((t) => t.pass).length, failed: tests.filter((t) => !t.pass).length, tests, perf, t3: window.__t3, elapsedMs: Math.round(performance.now() - t00) };

  // ===== optional: the real site =====================================================================================
  if (q.get('real') === '1') await realRun();

  const failed = tests.filter((t) => !t.pass).length;
  document.getElementById('summary').innerHTML = `<span class="${failed ? 'bad' : 'ok'}">${tests.length - failed} / ${tests.length} passed</span> · ${window.__result.elapsedMs} ms`;
  document.getElementById('perf').textContent = JSON.stringify({ perf, real: window.__result.real }, null, 2);
  window.__result.passed = tests.filter((t) => t.pass).length; window.__result.failed = failed;
}

// ---------------------------------------------------------------------------
async function realRun() {
  const out = {};
  try {
    const renderer = new THREE.WebGLRenderer({ antialias: false });
    renderer.setSize(64, 64);
    const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera();
    const occluders = [], animated = [];
    const ctx = {
      THREE, scene, renderer, camera, site, quality: q.get('quality') || 'low', maxAnisotropy: 1,
      registerOccluder: (m) => occluders.push(m), registerAnimated: (fn) => animated.push(fn),
      sunState: { azimuth: 150, elevation: 45, dirWorld: new THREE.Vector3(0.5, 0.7, 0.5), date: dateFromLocal(2026, 12, 21, 10, 30) },
      onSunChange: () => {},
    };
    const t0 = performance.now();
    const built = {};
    for (const [key, path, fn] of [['buildings', '../js/buildings/index.js', 'buildBuildings'], ['solar', '../js/solar/index.js', 'buildSolar'],
                                   ['structures', '../js/structures/index.js', 'buildStructures'], ['environment', '../js/env/index.js', 'buildEnvironment']]) {
      if (q.get('skip') && q.get('skip').split(',').includes(key)) continue;
      try { const mod = await import(path); const r = await mod[fn](ctx); built[key] = r; if (r && r.group) scene.add(r.group); out[key] = 'ok'; }
      catch (e) { out[key] = 'FAILED: ' + (e && e.message || e); }
    }
    out.buildMs = Math.round(performance.now() - t0);
    out.registeredOccluders = occluders.length;
    scene.updateMatrixWorld(true);
    if (!built.solar || !built.solar.modules) { out.error = 'no solar module list'; window.__result.real = out; return; }
    const an = createShadingAnalyzer(ctx, { modules: built.solar.modules, occluders, moduleMesh: built.solar.moduleMesh });
    const day = await an.runDay({ year: 2026, month: 12, day: 21 });
    out.day21Dec = {
      arrayLossPct: +day.arrayLossPct.toFixed(3), arrayBeamLossPct: +day.arrayBeamLossPct.toFixed(3), perPlaneLossPct: Object.fromEntries(Object.entries(day.perPlaneLossPct).map(([k, v]) => [k, +v.toFixed(3)])),
      worst: day.worst.slice(0, 5).map((w) => `${w.id} ${w.pct.toFixed(1)}%`), hourly: day.hourly.map((h) => `${h.label} ${h.lossPct.toFixed(1)}%`),
      timing: { ...day.timing, traceMs: Math.round(day.timing.traceMs), totalMs: Math.round(day.timing.totalMs), bvhMs: Math.round(day.timing.bvhMs), raysPerSec: Math.round(day.timing.raysPerSec) }, occluders: day.occluders,
    };
    window.__realDay = day;
    // layer-independence on the real scene: hiding Vegetation (and Vehicles) must not change the figure
    try {
      const env = built.environment;
      if (env && env.setVegetationVisible) {
        env.setVegetationVisible(false); env.setVehiclesVisible && env.setVehiclesVisible(false);
        const hid = await an.runDay({ year: 2026, month: 12, day: 21 });
        env.setVegetationVisible(true); env.setVehiclesVisible && env.setVehiclesVisible(true);
        out.layerIndependence = { hiddenLossPct: +hid.arrayLossPct.toFixed(4), visibleLossPct: +day.arrayLossPct.toFixed(4), same: hid.arrayLossPct === day.arrayLossPct, trees: hid.occluders.trees };
        out.disclosure = day.disclosure && day.disclosure.text;
        out.treeShare = day.vegetation && { sharePct: +day.vegetation.sharePct.toFixed(1), withoutPct: +day.vegetation.lossWithoutPct.toFixed(3) };
        check('REAL hiding the Vegetation layer does not change the shading result', hid.arrayLossPct === day.arrayLossPct, JSON.stringify(out.layerIndependence));
      }
    } catch (e) { out.layerIndependence = 'ERR ' + e; }
    if (q.get('year') === '1') {
      const yr = await an.runYear({ year: 2026 });
      // ONE loss definition: headline % is energy-weighted, so annual kWh = unshaded x (1 - headline) (the proposal arithmetic)
      try {
        const en = await import('../js/analysis/energy.js');
        const adj = en.shadingAdjustedEnergy(site.computeLayout(), yr);
        check('REAL year: lossBasis is energy and headline % = energy.js lossPct', yr.lossBasis === 'energy' && Math.abs(yr.arrayLossPct - adj.lossPct) < 1e-4, JSON.stringify({ head: yr.arrayLossPct, energyLoss: adj.lossPct, poa: yr.arrayPoaLossPct }));
        check('REAL year: unshaded kWh x (1 - headline) = shading-adjusted kWh', Math.abs(adj.unshadedAnnualKwh * (1 - yr.arrayLossPct / 100) - adj.annualKwh) < 0.5, JSON.stringify({ annual: adj.annualKwh }));
        out.yearBasis = { head: +yr.arrayLossPct.toFixed(3), poa: +yr.arrayPoaLossPct.toFixed(3), annualKwh: Math.round(adj.annualKwh) };
      } catch (e) { out.yearBasis = 'ERR ' + e; }
      out.year = { arrayLossPct: +yr.arrayLossPct.toFixed(3), monthly: yr.monthly.map((m) => `${m.name} ${m.lossPct.toFixed(2)}%`), timing: { ...yr.timing, traceMs: Math.round(yr.timing.traceMs), totalMs: Math.round(yr.timing.totalMs) } };
    }
  } catch (e) { out.error = String(e && e.stack || e); window.__errors.push('real: ' + out.error); }
  window.__result.real = out;
}

main().catch((e) => { window.__errors.push(String(e && e.stack || e)); document.getElementById('summary').innerHTML = '<span class="bad">crashed: ' + e + '</span>'; })
  .finally(() => { window.__ready = true; });
</script>
</body>
